[package]
name = "aimeeting"
version = "0.1.1"
description = "Windows-first realtime meeting copilot prototype"
authors = ["AIMeeting"]
edition = "2021"

[lib]
name = "aimeeting_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22.1"
reqwest = { version = "0.13.3", default-features = false, features = ["json", "multipart", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
