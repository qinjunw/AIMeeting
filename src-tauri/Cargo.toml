[package]
name = "aimeeting"
version = "0.1.2"
description = "Windows-first realtime meeting copilot prototype"
authors = ["AIMeeting"]
edition = "2021"

[lib]
name = "aimeeting_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22.1"
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
cpal = "=0.18.2"
futures-util = "0.3"
keyring = { version = "3.6.1", default-features = false, features = ["windows-native"] }
ogg = "0.9.2"
opus-rs = "0.1.29"
reqwest = { version = "0.13.3", default-features = false, features = ["json", "multipart", "rustls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "sync", "time"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
