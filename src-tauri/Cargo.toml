[package]
name = "aimeeting"
version = "0.1.0"
description = "Windows-first realtime meeting copilot prototype"
authors = ["AIMeeting"]
edition = "2021"

[lib]
name = "aimeeting_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
